name: Promote Proxy SIT → UAT

on:
  workflow_dispatch:
    inputs:
      proxy:
        description: "Proxy name to promote"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:

      - name: Start Promotion
        run: |
          echo "Starting proxy promotion"
          echo "Proxy: ${{ inputs.proxy }}"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Variables
        run: |
          echo "PROMOTE_PROXY=${{ inputs.proxy }}" >> $GITHUB_ENV
          echo "PROMO_BRANCH=promotion/sit-uat" >> $GITHUB_ENV
          echo "SOURCE_BRANCH=release/sit" >> $GITHUB_ENV
          echo "TARGET_BRANCH=release/uat" >> $GITHUB_ENV

      - name: Fetch Branches
        run: |
          git fetch origin $SOURCE_BRANCH
          git fetch origin $TARGET_BRANCH

      - name: Validate Proxy Exists in SIT
        run: |
          if git ls-tree -r origin/$SOURCE_BRANCH --name-only | grep -q "src/main/apiproxies/${PROMOTE_PROXY}"; then
            echo "Proxy found in SIT"
          else
            echo "::error::Proxy ${PROMOTE_PROXY} not found in $SOURCE_BRANCH"
            exit 1
          fi

      - name: Prepare Promotion Branch
        run: |
          git checkout -B $PROMO_BRANCH origin/$TARGET_BRANCH

      - name: Copy Proxy from SIT
        run: |
          git checkout origin/$SOURCE_BRANCH -- src/main/apiproxies/${PROMOTE_PROXY}

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add src/main/apiproxies/${PROMOTE_PROXY}

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "Promote ${PROMOTE_PROXY} from SIT to UAT"

      - name: Push Promotion Branch
        run: |
          git push origin $PROMO_BRANCH --force

      - name: Create or Update Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: promotion/sit-uat
          base: release/uat
          title: "Proxy Promotion SIT → UAT"
          body: |
            Automated proxy promotion.

            Proxy: `${{ env.PROMOTE_PROXY }}`
            Source: release/sit
            Target: release/uat