name: Prepare Proxy Promotion
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write

jobs:
  promote:
    # Restrict to specific branch patterns
    if: github.event.pull_request.base.ref == 'release/uat' && github.event.pull_request.head.ref == 'release/sit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check if promotion is allowed
        id: check
        run: |
          SRC="${{ github.event.pull_request.head.ref }}"
          TGT="${{ github.event.pull_request.base.ref }}"
          ALLOWED=("release/sit:release/uat" "release/uat:prod" "release/sit:prod")

          if [[ ! " ${ALLOWED[*]} " =~ "${SRC}:${TGT}" ]]; then
            echo "::error::Promotion from '${SRC}' to '${TGT}' is not allowed."
            exit 1
          fi
          echo "PROMOTE_SRC=$SRC" >> $GITHUB_ENV
          echo "PROMOTE_TGT=$TGT" >> $GITHUB_ENV

      - name: Extract proxy name from PR description
        id: extract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Use grep to find 'promote:my-proxy-name'
          PROXY=$(echo "$PR_BODY" | grep -oP 'promote:\K[^\s]+' | head -1)
          if [ -z "$PROXY" ]; then
            echo "::error::PR description must contain promote:<proxy-name>"
            exit 1
          fi
          echo "proxy=$PROXY" >> $GITHUB_OUTPUT
          echo "PROMOTE_PROXY=$PROXY" >> $GITHUB_ENV

      - name: Copy proxy from source branch
        run: |
          # Ensure we have the latest from origin
          git fetch origin $PROMOTE_SRC
          
          echo "Copying proxy ${PROMOTE_PROXY} from ${PROMOTE_SRC}..."
          # Checkout the specific folder from the source branch into the current workspace
          git checkout origin/$PROMOTE_SRC -- src/main/apiproxies/$PROMOTE_PROXY

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add src/main/apiproxies/$PROMOTE_PROXY
          
          if git diff --cached --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "Prepare promotion of $PROMOTE_PROXY from $PROMOTE_SRC to $PROMOTE_TGT"
            # Push back to the PR head branch
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
